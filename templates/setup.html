{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Welcome</h1>
  <p class="muted">No accounts exist yet. Create the first administrator account to secure access to your shop's data.</p>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <label>Business Name
      <input type="text" name="business_name" placeholder="My Retail Shop">
    </label>
    <label>Admin Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <label>Confirm Password
      <input type="password" name="confirm" required>
    </label>
    <button type="submit" class="btn-primary btn-block">Create Account &amp; Continue</button>
  </form>
</div>
{% endblock %}
